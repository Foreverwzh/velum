name: mobile

on:
  push:
    branches: ["**"] # 只按分支触发；推送版本标签由 release.yml 调用
    paths: ["mobile/**", "core/**", ".github/workflows/mobile.yml"]
  workflow_call: # release.yml 调用：打包发布产物
    inputs:
      version:
        type: string
        required: true
  pull_request:
    paths: ["mobile/**", "core/**", ".github/workflows/mobile.yml"]

# 同一分支推送新提交时取消旧的运行（避免连续推送时排队，挡住发布）；release.yml 调用时 ref 是版本标签，各自独立、不取消
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      GOPROXY: https://proxy.golang.org,direct
      VELUM_VERSION: ${{ inputs.version }} # 仅发布时非空
    steps:
      # 运行器磁盘有限：Go 核心编译三个架构、Gradle 打包都占空间，先删掉用不到的工具链
      - name: free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      # gomobile / gobind 与 core/go.mod 中的 golang.org/x/mobile 同一版本
      - name: gomobile
        working-directory: core
        run: |
          v=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$v golang.org/x/mobile/cmd/gobind@$v
      # 运行器自带 Android SDK 与 NDK（$ANDROID_HOME/ndk 下取最新版本）
      - name: core AAR
        run: sh scripts/core.sh && go clean -cache && df -h /
      - run: flutter pub get
      - name: analyze + test
        run: flutter analyze && flutter test
      # 未配置 key.properties 时为调试签名，仅供测试安装
      - name: build APK
        run: |
          flutter build apk --release --split-per-abi ${VELUM_VERSION:+--build-name=$VELUM_VERSION --build-number=$GITHUB_RUN_NUMBER}
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do abi=${f#app-}; mv "$f" "Velum-${VELUM_VERSION:-dev}-android-${abi%-release.apk}.apk"; done
      - uses: actions/upload-artifact@v7
        with:
          name: velum-android
          path: mobile/build/app/outputs/flutter-apk/Velum-*.apk
          retention-days: 14
