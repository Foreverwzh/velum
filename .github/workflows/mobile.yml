name: mobile

on:
  push:
    branches: ["**"] # 只按分支触发；推送版本标签由 release.yml 调用
    paths: ["mobile/**", "core/**", ".github/workflows/mobile.yml"]
  workflow_call: # release.yml 调用：打包发布产物
    inputs:
      version:
        type: string
        required: true
  pull_request:
    paths: ["mobile/**", "core/**", ".github/workflows/mobile.yml"]

# 同一分支推送新提交时取消旧的运行（避免连续推送时排队，挡住发布）；release.yml 调用时 ref 是版本标签，各自独立、不取消
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      GOPROXY: https://proxy.golang.org,direct
      VELUM_VERSION: ${{ inputs.version }} # 仅发布时非空
    steps:
      # 运行器磁盘有限：Gradle 打包占空间，先删掉用不到的工具链
      - name: free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      # 核心（Rust）是预编译的：私有仓库 velum-engine 的 Release，版本与 sha256 见 mobile/android/engine.lock。
      # 用 VELUM_ENGINE_TOKEN 下载（只读那个仓库内容的 fine-grained 令牌，与 iOS 共用）
      - name: core
        env:
          GH_TOKEN: ${{ secrets.VELUM_ENGINE_TOKEN }}
        run: |
          # 还没有发布过 Android 核心（engine.lock 没有版本）：只检查 Dart，不打包；发版时必须有
          if ! grep -q '^version=.' android/engine.lock; then
            [[ -z "$VELUM_VERSION" ]] || { echo "✗ android/engine.lock 没有版本：先用 velum-engine 的 scripts/release-android.sh 发布核心"; exit 1; }
            echo "::warning::android/engine.lock 没有版本，跳过核心与 APK 打包"
            echo "NO_CORE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          [[ -n "$GH_TOKEN" ]] || { echo "✗ 没配置 VELUM_ENGINE_TOKEN（读 velum-engine 的 Release）"; exit 1; }
          sh scripts/core.sh && go clean -cache && df -h /
      - run: flutter pub get
      - name: analyze + test
        run: flutter analyze && flutter test
      # 未配置 key.properties 时为调试签名，仅供测试安装
      - name: build APK
        if: env.NO_CORE != '1'
        run: |
          flutter build apk --release --split-per-abi ${VELUM_VERSION:+--build-name=$VELUM_VERSION --build-number=$GITHUB_RUN_NUMBER}
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do abi=${f#app-}; mv "$f" "Velum-${VELUM_VERSION:-dev}-android-${abi%-release.apk}.apk"; done
      - uses: actions/upload-artifact@v7
        if: env.NO_CORE != '1'
        with:
          name: velum-android
          path: mobile/build/app/outputs/flutter-apk/Velum-*.apk
          retention-days: 14
