name: ios

# 发版时由 release.yml 调用：出 iOS 包传到 App Store Connect，处理完出现在 TestFlight。
# 单独一个工作流、不在 publish 的 needs 里：TestFlight 出问题不挡 GitHub Release。
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  # 手动重跑 iOS 这一段，不用再发一个版本
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，如 0.1.0-rc.29
        type: string
        required: true

jobs:
  testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile/ios
    env:
      GOPROXY: https://proxy.golang.org,direct
      VELUM_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      # 部署目标 iOS 26.1，App Store 也要求当前大版本的 SDK：用运行器上最新的正式版 Xcode
      - name: select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      # iOS 不含 Go；Go 只用来导出核心文字的英文表（scripts/core-i18n.sh），不用 gomobile
      - name: xcodegen
        run: brew install xcodegen
      # 签名分两段，都是自动签名：
      # - 导出时用 App Store Connect API 密钥走云端托管的分发证书，私钥不出 Apple，CI 上不放分发证书。
      # - 归档时 Xcode 要一张本机有私钥的开发证书。不给的话它每次用密钥新建一张，团队里越攒越多，
      #   所以固定用 secrets 里这一张。
      - name: import signing credentials
        env:
          # 和桌面公证共用同一把 App Store Connect API 密钥
          ASC_KEY_P8: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          DEV_CERT_P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          DEV_CERT_P12_PASSWORD: ${{ secrets.IOS_DEV_CERT_P12_PASSWORD }}
        run: |
          for var in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID DEV_CERT_P12_BASE64 DEV_CERT_P12_PASSWORD; do
            [[ -n "${!var}" ]] || { echo "✗ 没配置 iOS 签名的 secret（$var），见 mobile/ios/README.md"; exit 1; }
          done
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          {
            echo "ASC_KEY_PATH=$key_path"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          pw="$(uuidgen)"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          echo "$DEV_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dev-cert.p12"
          security import "$RUNNER_TEMP/dev-cert.p12" -k "$keychain" -P "$DEV_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dev-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$keychain"
          existing="$(security list-keychains -d user | sed 's/[\" ]//g')"
          security list-keychains -d user -s "$keychain" $existing
      # 不含 Go：App 用 Rust 控制面（VelumCore），隧道用 velum-engine，都是预编译的（私有仓库的 Release，版本与 sha256 见 mobile/ios/engine.lock）
      # 用 VELUM_ENGINE_TOKEN 下载（只读那个仓库内容的 fine-grained 令牌）
      - name: build and upload to TestFlight
        env:
          GH_TOKEN: ${{ secrets.VELUM_ENGINE_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "✗ 没配置 VELUM_ENGINE_TOKEN（读 velum-engine 的 Release），见 mobile/ios/README.md"; exit 1; }
          ./scripts/build-ios.sh --upload
      - name: clean up signing credentials
        if: always()
        run: |
          rm -f "${ASC_KEY_PATH:-}"
          [[ -n "${KEYCHAIN_PATH:-}" ]] && security delete-keychain "$KEYCHAIN_PATH" || true
