name: release

# 推送版本标签（如 v0.1.0-rc.1）时打包各平台安装包并创建 GitHub Release；带 - 的标签发布为预发布版本。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  mobile:
    needs: version
    uses: ./.github/workflows/mobile.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [desktop, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # 自动更新清单（Tauri updater 格式）：App 经 velumd 找到所选通道中最新发布的 latest.json，下载对应平台的包并校验签名
      - name: updater manifest
        run: |
          v="${GITHUB_REF_NAME#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          mac="Velum-$v-macos-arm64.app.tar.gz"
          win="Velum-$v-windows-x64-setup.exe"
          jq -n --arg v "$v" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg macsig "$(cat "dist/$mac.sig")" --arg macurl "$base/$mac" \
            --arg winsig "$(cat "dist/$win.sig")" --arg winurl "$base/$win" \
            '{version: $v, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $macsig, url: $macurl},
              "windows-x86_64": {signature: $winsig, url: $winurl}}}' > dist/latest.json
          rm dist/*.sig
          cat dist/latest.json
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $pre --verify-tag \
            --title "Velum $GITHUB_REF_NAME" --notes-file .github/release/notes.md --generate-notes
