name: desktop

on:
  push:
    branches: ["**"] # 只按分支触发；推送版本标签由 release.yml 调用
    paths: ["desktop/**", "core/**", "mise.toml", ".github/workflows/desktop.yml"]
  workflow_dispatch: # 手动触发：打包安装包；填写版本号时按发布构建（含自动更新包），用于发布前验证
    inputs:
      version:
        type: string
        required: false
  workflow_call: # release.yml 调用：打包发布产物
    inputs:
      version:
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_PRIVATE_KEY:
        required: false
      APPLE_PROFILE_HOST:
        required: false
      APPLE_PROFILE_TUNNEL:
        required: false
  pull_request:
    paths: ["desktop/**", "core/**", "mise.toml", ".github/workflows/desktop.yml"]

# 同一分支推送新提交时取消旧的运行（避免连续推送时排队，挡住发布）；release.yml 调用时 ref 是版本标签，各自独立、不取消
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      # 与本地一致：bun 版本由 mise.toml 固定
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: bun install --frozen-lockfile
      - name: typecheck + build frontend
        run: bun run typecheck && bun run build
      # tauri-build 会检查 externalBin 是否存在，需先构建 Go 核心
      - name: sidecars
        run: sh scripts/sidecars.sh
      - name: clippy + test
        working-directory: desktop/src-tauri
        run: cargo clippy -- -D warnings && cargo test --lib

  # 打包安装包供测试机安装。只在推送到 main 或手动触发时运行，PR 不打包。
  # macOS：配置了 Developer ID 证书（APPLE_*）时签名并公证，velum-helper 只接受同一团队签名的 velumd；否则 ad-hoc 签名。
  # 签名构建且配置了描述文件（APPLE_PROFILE_*）时内置 NetworkExtension 系统扩展（docs/MN-PLAN.md、desktop/extension/build.sh）。
  package:
    if: github.event_name != 'pull_request'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple 芯片
            artifact: velum-macos-arm64
          - os: windows-latest
            artifact: velum-windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GOPROXY: https://proxy.golang.org,direct
      VELUM_VERSION: ${{ inputs.version }} # 仅发布（或手动触发时填写了版本号）时非空
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: bun install --frozen-lockfile
      # beforeBuildCommand 会构建 Go 核心（sidecars）与前端。
      # 发布时写入版本号，并生成自动更新包（macOS .app.tar.gz、Windows setup.exe）及其签名（需要仓库 Secrets 中的更新签名私钥）
      - name: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Developer ID 签名（证书为 base64 的 .p12）与公证（App Store Connect API 密钥）。
          # 先放在其他名字下：Tauri 只看 APPLE_* 是否存在，空值也会去导入证书 / 公证而失败，所以只在非空时导出。
          # 只在发布构建（有版本号）时签名公证：公证要排 Apple 的队列，分支构建用 ad-hoc 签名即可
          SIGN_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          PROFILE_HOST: ${{ secrets.APPLE_PROFILE_HOST }}
          PROFILE_TUNNEL: ${{ secrets.APPLE_PROFILE_TUNNEL }}
        run: |
          conf='{}'
          if [ "$RUNNER_OS" = macOS ] && [ -n "$VELUM_VERSION" ] && [ -n "$SIGN_CERTIFICATE" ] && [ -n "$SIGN_IDENTITY" ]; then
            export APPLE_SIGNING_IDENTITY="$SIGN_IDENTITY"
            export VELUM_TEAM_ID=H3H5ULV8KR # 与签名证书的团队一致
            if [ -n "$NOTARY_PRIVATE_KEY" ]; then
              export APPLE_API_ISSUER="$NOTARY_ISSUER" APPLE_API_KEY="$NOTARY_KEY_ID" APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
              printf '%s' "$NOTARY_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
            fi
            if [ -n "$PROFILE_HOST" ] && [ -n "$PROFILE_TUNNEL" ]; then
              # 扩展与 sidecar 在 Tauri 之前签名，证书要先导入（Tauri 导入的钥匙串只在它自己的构建期间存在）；Tauri 随后直接使用这个钥匙串
              kc="$RUNNER_TEMP/velum.keychain-db"
              security create-keychain -p "" "$kc"
              security set-keychain-settings -lut 21600 "$kc"
              security unlock-keychain -p "" "$kc"
              printf '%s' "$SIGN_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
              security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$SIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$kc" >/dev/null
              security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
              printf '%s' "$PROFILE_HOST" | base64 --decode > "$RUNNER_TEMP/host.provisionprofile"
              printf '%s' "$PROFILE_TUNNEL" | base64 --decode > "$RUNNER_TEMP/tunnel.provisionprofile"
              brew install xcodegen
              (cd ../core && v=$(go list -m -f '{{.Version}}' golang.org/x/mobile) &&
                go install golang.org/x/mobile/cmd/gomobile@$v golang.org/x/mobile/cmd/gobind@$v)
              VELUM_PROFILE_HOST="$RUNNER_TEMP/host.provisionprofile" VELUM_PROFILE_TUNNEL="$RUNNER_TEMP/tunnel.provisionprofile" \
                sh extension/build.sh
              conf="$(cat src-tauri/tauri.ne.conf.json)"
            else
              export APPLE_CERTIFICATE="$SIGN_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$SIGN_CERTIFICATE_PASSWORD"
            fi
          fi
          if [ -n "$VELUM_VERSION" ]; then
            conf="$(printf '%s' "$conf" | jq -c --arg v "$VELUM_VERSION" '. * {version: $v, bundle: {createUpdaterArtifacts: true}}')"
          fi
          bun tauri build --config "$conf"
      # upload-artifact 打 zip 时会丢掉可执行权限：.app 先用 ditto 打包（保留权限与签名）
      - name: collect (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ../dist-pkg
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Velum.app ../dist-pkg/Velum-${VELUM_VERSION:-dev}-macos-arm64.zip
          if [ -n "$VELUM_VERSION" ]; then
            cp src-tauri/target/release/bundle/macos/Velum.app.tar.gz ../dist-pkg/Velum-$VELUM_VERSION-macos-arm64.app.tar.gz
            cp src-tauri/target/release/bundle/macos/Velum.app.tar.gz.sig ../dist-pkg/Velum-$VELUM_VERSION-macos-arm64.app.tar.gz.sig
          fi
      - name: collect (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p ../dist-pkg
          cp src-tauri/target/release/bundle/nsis/*.exe ../dist-pkg/Velum-${VELUM_VERSION:-dev}-windows-x64-setup.exe
          if [ -n "$VELUM_VERSION" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe.sig ../dist-pkg/Velum-$VELUM_VERSION-windows-x64-setup.exe.sig
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist-pkg/*
          retention-days: 14
