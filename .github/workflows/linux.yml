name: linux

# 打包 Linux 命令行压缩包（Rust 核心：velumd、vlu，网页界面，见 core/scripts/linux-package.sh）并实际跑一遍冒烟测试；
# release.yml 调用时产物随 Release 发布。velumd、vlu 按 desktop/engine.lock 从 velum-engine 的私有 Release 下载
#（VELUM_ENGINE_TOKEN 只读那个仓库）。
on:
  push:
    branches: ["**"] # 只按分支触发；推送版本标签由 release.yml 调用
    paths: ["core/**", "desktop/**", ".github/workflows/linux.yml"]
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      VELUM_ENGINE_TOKEN:
        required: false

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x64, triple: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, arch: arm64, triple: aarch64-unknown-linux-gnu}
    runs-on: ${{ matrix.os }}
    env:
      GOPROXY: https://proxy.golang.org,direct
      VELUM_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Go 只用来生成核心的英文表（core/scripts/core-i18n.sh 导出 Go 版的条目）
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      # bun 版本由 mise.toml 固定
      - uses: jdx/mise-action@v5
      - name: build web ui
        working-directory: desktop
        run: bun install --frozen-lockfile && bun run build
      - name: package
        env:
          GH_TOKEN: ${{ secrets.VELUM_ENGINE_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "没配置 VELUM_ENGINE_TOKEN（读 velum-engine 的 Release）"; exit 1; }
          name="Velum-${VELUM_VERSION:-dev}-linux-${{ matrix.arch }}"
          sh core/scripts/linux-package.sh ${{ matrix.triple }} "dist-pkg/$name"
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
      - name: smoke
        run: sh core/scripts/smoke.sh "dist-pkg/$PKG_NAME"
      - name: service smoke
        run: sudo sh core/scripts/service-smoke.sh "dist-pkg/$PKG_NAME"
      - name: tun regression (netns)
        run: |
          command -v nft >/dev/null || sudo apt-get install -y nftables
          sudo bash core/scripts/netns-tun.sh "dist-pkg/$PKG_NAME"
      - name: archive
        run: tar -C dist-pkg -czf "dist-pkg/$PKG_NAME.tar.gz" "$PKG_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist-pkg/${{ env.PKG_NAME }}.tar.gz
          if-no-files-found: error
