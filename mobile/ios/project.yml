name: Velum
options:
  bundleIdPrefix: io.github.foreverwzh
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.1"
settings:
  base:
    DEVELOPMENT_TEAM: H3H5ULV8KR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    # 发版时由 scripts/build-ios.sh 覆盖
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Velum:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # velum-core 的 Swift 接口（scripts/engine.sh 从 velum-engine 生成：swift-bridge 桥接、typeshare 生成的类型、类型化包装）
      - build/VelumCoreSwift
      # 第三方版权声明（scripts/notices.sh 生成）
      - path: build/ThirdPartyNotices.txt
        buildPhase: resources
        optional: true
      # Rust 核心返回的文字的英文表（scripts/core-i18n.sh 生成）
      - path: build/core-en.json
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Velum
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        NSLocalNetworkUsageDescription: Velum uses your network's DNS server, often your router, to resolve addresses when it is not connected.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.foreverwzh.velum
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_OBJC_BRIDGING_HEADER: App/Bridging.h
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.developer.networking.wifi-info: true
        com.apple.security.application-groups: [group.io.github.foreverwzh.velum]
    dependencies:
      - target: VelumTunnel
        embed: true
      - framework: build/Mobilebind.xcframework
        embed: false
      # velum-engine（闭源，不进本仓库）：scripts/engine.sh 从本机的 velum-engine 编译到 build/。
      # App 只能链接一个 Rust 静态库：VelumCore 含控制面 velum-core，也含引擎的 C 接口（编译路由文件、本地引擎）
      - framework: build/VelumCore.xcframework
        embed: false
      # BoringSSL 含 C++ 代码
      - sdk: libc++.tbd
      - sdk: NetworkExtension.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: libresolv.tbd
  VelumTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel, Shared]
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Velum Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.developer.networking.wifi-info: true
        com.apple.security.application-groups: [group.io.github.foreverwzh.velum]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.foreverwzh.velum.tunnel
    dependencies:
      - framework: build/Iostunnel.xcframework
        embed: false
      - framework: build/VelumEngine.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: NetworkExtension.framework
      - sdk: MetricKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: libresolv.tbd
  VelumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.foreverwzh.velum.uitests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Velum
schemes:
  Velum:
    build:
      targets:
        Velum: all
        VelumUITests: [test]
    test:
      targets: [VelumUITests]
