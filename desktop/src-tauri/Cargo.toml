[package]
name = "velum-desktop"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Velum desktop shell"

[lib]
name = "velum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSAttributedString", "NSDictionary", "NSNotification", "NSObject", "NSOperation", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAttributedString", "NSFont", "NSMenu", "NSMenuItem", "NSParagraphStyle", "NSStringDrawing", "NSText"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO"] }

[profile.release]
strip = true
lto = true
