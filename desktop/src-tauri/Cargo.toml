[package]
name = "velum-desktop"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Velum desktop shell"

[lib]
name = "velum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO"] }

[profile.release]
strip = true
lto = true
